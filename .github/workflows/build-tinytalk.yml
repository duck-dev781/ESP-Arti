name: Build ESP-Arti TinyTalk 2

on:
  workflow_dispatch:
  push:
    paths:
      - "output/ESP-Arti-WiFi/**"
      - ".github/workflows/build-tinytalk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ESP-Arti
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Configure ESP32 package index
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12

      - name: Fetch pinned TinyTalk runtime
        run: |
          git clone --depth 1 https://github.com/therezor/cardputer-ai.git /tmp/cardputer-ai
          cd /tmp/cardputer-ai
          git fetch --depth 1 origin 78c5128672b750977619dc0a6c3b8baed91168ed
          git checkout 78c5128672b750977619dc0a6c3b8baed91168ed
          cp main/llm.h "$GITHUB_WORKSPACE/output/ESP-Arti-WiFi/llm.h"
          cp main/llm.cpp "$GITHUB_WORKSPACE/output/ESP-Arti-WiFi/llm.cpp"

      - name: Compile WROVER firmware
        run: |
          arduino-cli compile             --fqbn "esp32:esp32:esp32wrover:FlashFreq=80,FlashMode=qio,PartitionScheme=huge_app,DebugLevel=none,EraseFlash=none,UploadSpeed=921600"             --output-dir output/firmware             --build-property "compiler.cpp.extra_flags=-DLLM_FORCE_SCALAR"             output/ESP-Arti-WiFi

      - name: Package firmware
        run: |
          cp output/firmware/ESP-Arti-WiFi.ino.bin output/ESP-Arti-TinyTalk2-WROVER.bin
          sha256sum output/ESP-Arti-TinyTalk2-WROVER.bin > output/ESP-Arti-TinyTalk2-WROVER.bin.sha256

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESP-Arti-TinyTalk2-WROVER
          path: |
            output/ESP-Arti-TinyTalk2-WROVER.bin
            output/ESP-Arti-TinyTalk2-WROVER.bin.sha256
