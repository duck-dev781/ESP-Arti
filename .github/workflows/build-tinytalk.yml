name: Build ESP-Arti V3

on:
  workflow_dispatch:
  push:
    paths:
      - "output/ESP-Arti-WiFi/**"
      - "ai/**"
      - ".github/workflows/build-tinytalk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ESP-Arti
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Configure ESP32 package index
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12

      - name: Prepare embedded tokenizer
        env:
          TOKENIZER_URL: https://raw.githubusercontent.com/therezor/cardputer-ai/78c5128672b750977619dc0a6c3b8baed91168ed/embed/tok_neo.bin
        run: |
          mkdir -p output/ESP-Arti-WiFi
          curl -fL --retry 3 "$TOKENIZER_URL" -o /tmp/tok_neo.bin
          python3 - <<'PY'
          from pathlib import Path
          data=Path('/tmp/tok_neo.bin').read_bytes()
          with open('output/ESP-Arti-WiFi/tokenizer_data.h','w') as f:
              f.write('#pragma once\\n#include <stddef.h>\\n#include <stdint.h>\\n')
              f.write('static const uint8_t TINY_TALK_TOKENIZER_DATA[] = {\\n')
              for i in range(0,len(data),16):
                  f.write('  '+','.join(str(x) for x in data[i:i+16])+',\\n')
              f.write('};\\nstatic const size_t TINY_TALK_TOKENIZER_SIZE = sizeof(TINY_TALK_TOKENIZER_DATA);\\n')
          PY

      - name: Fetch TinyTalk V3 runtime
        run: |
          git clone --depth 1 https://github.com/therezor/cardputer-ai.git /tmp/cardputer-ai
          cp /tmp/cardputer-ai/main/llm.h "$GITHUB_WORKSPACE/output/ESP-Arti-WiFi/llm.h"
          cp /tmp/cardputer-ai/main/llm.cpp "$GITHUB_WORKSPACE/output/ESP-Arti-WiFi/llm.cpp"

      - name: Compile WROVER firmware
        run: |
          arduino-cli compile             --fqbn "esp32:esp32:esp32wrover:FlashFreq=80,FlashMode=qio,PartitionScheme=huge_app,DebugLevel=none,EraseFlash=none,UploadSpeed=921600"             --output-dir output/firmware             --build-property "compiler.cpp.extra_flags=-DLLM_FORCE_SCALAR"             output/ESP-Arti-WiFi

      - name: Package firmware
        run: |
          cp output/firmware/ESP-Arti-WiFi.ino.bin output/ESP-Arti-V3-WROVER.bin
          sha256sum output/ESP-Arti-TinyTalk2-WROVER.bin > output/ESP-Arti-TinyTalk2-WROVER.bin.sha256

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESP-Arti-V3-WROVER
          path: |
            output/ESP-Arti-TinyTalk2-WROVER.bin
            output/ESP-Arti-TinyTalk2-WROVER.bin.sha256
