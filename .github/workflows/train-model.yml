name: Train and publish ESP-Arti model

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install training dependencies
        run: python -m pip install --upgrade pip torch

      - name: Train and export runtime files
        run: python training/train.py

      - name: Commit generated AI files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai/
          if git diff --cached --quiet; then
            echo "No AI changes to commit."
          else
            git commit -m "Update ESP-Arti AI runtime files"
            git push
          fi
